name: Nexus compile check

on:
  push:
    branches:
      - ci-buildcheck
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python engine dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax and durable market index invariant
        run: |
          python -m py_compile api/*.py scripts/oliver_e2e.py
          python - <<'PY'
          import pandas as pd
          import api.oliver_store as store

          store.configured = lambda: True
          store._request = lambda *args, **kwargs: [
              {"ts":"2026-08-10T13:30:00+00:00","open":100.0,"high":101.0,"low":99.5,"close":100.5,"volume":1000},
              {"ts":"2026-08-10T13:35:00+00:00","open":100.5,"high":101.5,"low":100.0,"close":101.0,"volume":1200},
          ]
          frame = store.load_bars("AAPL", "5m")
          assert isinstance(frame.index, pd.DatetimeIndex), type(frame.index)
          assert frame.index.tz is not None, frame.index
          assert frame.index.name == "Datetime"
          print("PASS durable load returns timezone-aware DatetimeIndex")
          PY
