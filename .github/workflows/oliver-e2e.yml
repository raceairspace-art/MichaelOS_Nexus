name: Digital Oliver production E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for matching Vercel production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MichaelOS-Oliver-E2E",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as res:
                  return json.load(res)

          base = f"https://api.github.com/repos/{repo}"
          for attempt in range(72):
              deployments = get(f"{base}/deployments?sha={sha}&environment=Production&per_page=20")
              vercel = next((d for d in deployments if d.get("creator", {}).get("login") == "vercel[bot]"), None)
              if vercel:
                  statuses = get(vercel["statuses_url"])
                  if statuses:
                      latest = statuses[0]
                      state = latest.get("state")
                      url = latest.get("environment_url") or latest.get("target_url")
                      print(f"Vercel deployment state={state} url={url}")
                      if state == "success" and url:
                          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                              fh.write(f"base_url={url.rstrip('/')}\n")
                          raise SystemExit(0)
                      if state in {"failure", "error", "inactive"}:
                          raise SystemExit(f"Vercel deployment ended in {state}")
              time.sleep(10)
          raise SystemExit("Timed out waiting for matching Vercel production deployment")
          PY

      - name: Run live market-to-AI-to-ranking smoke test
        env:
          BASE_URL: ${{ steps.deployment.outputs.base_url }}
        run: |
          echo "Note: Vercel deployment protection must allow automation for this external smoke test."
          python scripts/oliver_e2e.py "$BASE_URL"
